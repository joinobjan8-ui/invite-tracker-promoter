services:
  - type: web
    name: promoter-invite-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 8 --timeout 120 --keep-alive 5
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: BOT_TOKEN
        sync: false
      - key: GROUP_ID
        value: "@Promoter0007"
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: promoter_giveaway
      - key: WEBHOOK_SECRET
        generateValue: true
      # Optional tuning (defaults shown)
      - key: AUTO_DELETE_SECONDS
        value: "120"
      - key: LINK_COOLDOWN_SECONDS
        value: "10"
      - key: KEEPALIVE_SECONDS
        value: "540"
